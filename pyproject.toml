[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-edai"
version = "0.1.0"
description = "End-to-End Medallion Lakehouse, ML & Agentic Quant AI Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quant AI Engineering Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.5.0",
    "ruamel.yaml>=0.17.0",
    "openpyxl>=3.1.0",
    "minio>=7.2.20",
    "fastavro>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "mutmut>=2.4.0",
    "locust>=2.15.0",
]
spark = [
    "pyspark>=3.5.0,<4.0.0",
]
kafka = [
    "kafka-python-ng>=2.2.0",
]
ml = [
    "redis>=5.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "lightgbm>=4.0.0",
    "mlflow>=2.10.0",
    "feast>=0.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
